<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">AIGC workflow placeholder</title>
  <desc id="desc">A dark vertical placeholder image for the portfolio workflow section.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111114"/>
      <stop offset="0.52" stop-color="#181225"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <radialGradient id="glow" cx="48%" cy="36%" r="54%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.42"/>
      <stop offset="0.52" stop-color="#34d399" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
